<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <title>Netlify Forms Placeholder</title>
</head>

<body>
    <!-- Marketing Form Placeholder -->
    <form name="marketing-form" data-netlify="true" hidden>
        <input type="text" name="qnaKnd" />
        <input type="text" name="subject" />
        <input type="text" name="first_name" />
        <input type="text" name="companyPosition" />
        <input type="text" name="telephone" />
        <input type="text" name="email" />
        <textarea name="comments"></textarea>
        <input type="checkbox" name="chk_info" />
        <input type="checkbox" name="chk_m" />
    </form>

    <!-- PR Main Form Placeholder -->
    <form name="pr-main-form" data-netlify="true" hidden>
        <input type="text" name="company" />
        <input type="text" name="tel" />
        <input type="text" name="email" />
        <textarea name="massage"></textarea>
        <input type="checkbox" name="agree" />
        <input type="checkbox" name="mark_agree" />
        <input type="hidden" name="subject" />
    </form>

    <!-- PR Quick Form Placeholder -->
    <form name="pr-quick-form" data-netlify="true" hidden>
        <input type="text" name="q_name" />
        <input type="text" name="q_tel" />
        <textarea name="q_message"></textarea>
        <input type="checkbox" name="agree" />
        <input type="hidden" name="subject" />
    </form>
</body>

</html>
